services:
  postgres:
    ports: !reset []
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
  loki:
    restart: unless-stopped
  promtail:
    restart: unless-stopped
  grafana:
    restart: unless-stopped
  prometheus:
    restart: unless-stopped
